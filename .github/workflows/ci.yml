name: C Build

on:
  push:
    branches: [ master, development ]
  pull_request:
    branches: [ master ]

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Build with Make
      run: make
    
    - name: Run program (basic test)
      run: |
        echo "Программа собрана успешно"
        ls -la bin/

